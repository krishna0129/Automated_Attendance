{% extends 'recognition/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Log in{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="panel auth-card">
    <span class="icon-badge"><i class="bi bi-person-circle"></i></span>
    <h1>Log in</h1>
    <p class="sub">Sign in to view your attendance or manage the system.</p>
    <form method="POST">
      {% csrf_token %}
      {{ form|crispy }}
      <input type="hidden" name="next" value="{{ next }}">
      <button class="btn btn-brand btn-block mt-2" type="submit">Log in</button>
    </form>
    <p class="text-center text-muted small mt-4 mb-0"><a href="{% url 'home' %}"><i class="bi bi-arrow-left"></i> Back to attendance</a></p>
  </div>
</div>
{% endblock %}
