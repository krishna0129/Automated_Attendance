# Optional local PostgreSQL for the attendance system.
#   docker compose up -d
#   export DATABASE_URL=postgres://attendance:attendance@localhost:5432/attendance
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
