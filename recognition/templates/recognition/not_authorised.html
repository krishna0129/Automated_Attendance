{% extends 'recognition/base.html' %}

{% block title %}Not authorised{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="panel auth-card text-center">
    <span class="icon-badge red"><i class="bi bi-shield-lock"></i></span>
    <h1>Access denied</h1>
    <p class="sub">Sorry{% if user.is_authenticated %}, {{ user.username }}{% endif %}. You are not authorised to view this page.</p>
    <a class="btn btn-brand" href="{% url 'dashboard' %}"><i class="bi bi-arrow-left"></i> Back to dashboard</a>
  </div>
</div>
{% endblock %}
